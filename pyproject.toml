[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend API"
authors = [
    {name = "Ray Sun", email = "xiaoquqi@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "django==5.1.4",
    "djangorestframework==3.15.2",
    "djangorestframework_simplejwt==5.3.1",
    "djangorestframework-camel-case==1.4.2",
    "dj-rest-auth==7.0.0",
    "drf-spectacular",
    "python-dotenv",
    "dj_database_url==2.3.0",
    "psycopg2-binary>=2.9.9",  # PostgreSQL adapter (recommended)
    "celery==5.3.1",
    "django-celery-beat==2.7.0",
    "django_celery_results",
    "flower==2.0.1",
    "redis",
    "sentry-sdk>=1.40.0",  # Error tracking and performance monitoring
    "gunicorn==20.1.0",
    "django-allauth>=0.57.0",
    "cryptography>=42.0.0",
    "django-cors-headers>=4.3.0",
    "pillow>=10.0.0",
    "channels==4.2.0",
    "channels-redis==4.2.1",
    "daphne==4.1.2",
    "uvicorn[standard]==0.30.6",
    "langchain-core==1.4.0",
    "langgraph==1.2.1",
    "bleach>=6.2.0,<7.0.0",
    "markdown>=3.7,<4.0",
    "requests>=2.32.0,<3.0.0",
    # Agentcore submodules. Docker local builds rewrite these to local
    # file paths from backend/agentcore to avoid GitHub during image builds.
    "agentcore-metering @ git+https://github.com/cloud2ai/agentcore-metering.git",
    "agentcore-task @ git+https://github.com/cloud2ai/agentcore-task.git",
    "agentcore-notifier @ git+https://github.com/cloud2ai/agentcore-notifier.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.2",
    "black>=22.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["test_*.py", "pytest_*.py"]
markers = [
    "unit: App-level unit tests (domain logic, services, model methods).",
]

[tool.setuptools]
packages = ["backend"]

[project.scripts]
backend-manager = "backend.manage:main"
