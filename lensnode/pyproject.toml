[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lensnode"
version = "0.1.0"
description = "SourceLens LensNode execution worker"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.2.0",
    "httpx>=0.28.0",
    "langchain-core==1.4.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.2",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "sentry-sdk>=1.40.0",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
lensnode = "lensnode.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lensnode*"]
