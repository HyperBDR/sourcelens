  <rect x="52" y="866" width="1336" height="166" rx="14" fill="#FDFCFB" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="70" y="889" class="section-title" fill="#6B7280">04  RUNTIME RESOLUTION &amp; SAFE INJECTION</text>

