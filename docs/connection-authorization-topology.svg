  <text x="187" y="400" class="node-title" text-anchor="middle">Admin / User UI</text>
  <text x="187" y="421" class="node-subtitle" text-anchor="middle">Schema-driven forms</text>
  <text x="187" y="442" class="node-detail" text-anchor="middle">新建连接 · 选择授权 · 测试连通性</text>
  <text x="187" y="460" class="node-detail" text-anchor="middle">查看引用、轮换、删除影响</text>

  <text x="515" y="399" class="node-title" text-anchor="middle">Provider Descriptor</text>
  <text x="515" y="420" class="node-subtitle" text-anchor="middle">只描述“需要什么”</text>
  <text x="515" y="441" class="node-detail" text-anchor="middle">Connection Schema · Credential Types</text>
  <text x="515" y="459" class="node-detail" text-anchor="middle">Capabilities · Validation Adapter</text>

  <text x="836" y="399" class="node-title" text-anchor="middle">Connection</text>
  <text x="836" y="420" class="node-subtitle" text-anchor="middle">可复用的已配置连接</text>
  <text x="836" y="441" class="node-detail" text-anchor="middle">Provider · Endpoint · Non-secret Config</text>
  <text x="836" y="459" class="node-detail" text-anchor="middle">Status · Validated At</text>

  <text x="836" y="523" class="node-title" text-anchor="middle">CredentialSet</text>
  <text x="836" y="544" class="node-subtitle" text-anchor="middle">可复用的加密身份材料</text>
  <text x="836" y="565" class="node-detail" text-anchor="middle">Token · Username/Password · App Credentials</text>
  <text x="836" y="583" class="node-detail" text-anchor="middle">Secret Version · Owner · Sharing Scope</text>

  <text x="1158" y="399" class="node-title" text-anchor="middle">Grant &amp; Audit</text>
  <text x="1158" y="420" class="node-subtitle" text-anchor="middle">授权与管理权限分离</text>
  <text x="1158" y="441" class="node-detail" text-anchor="middle">manage · use · share</text>
  <text x="1158" y="459" class="node-detail" text-anchor="middle">Validation · Rotation · Usage Logs</text>

  <text x="1158" y="523" class="node-title" text-anchor="middle">Runtime Resolver</text>
  <text x="1158" y="544" class="node-subtitle" text-anchor="middle">按 Run / User / Binding 解析</text>
  <text x="1158" y="565" class="node-detail" text-anchor="middle">Reference only in snapshots</text>
  <text x="1158" y="583" class="node-detail" text-anchor="middle">Short-lived secret lease</text>

