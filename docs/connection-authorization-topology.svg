<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">SourceLens 连接、授权与扩展消费者拓扑图</title>
  <desc id="desc">Provider 描述协议、Connection、CredentialSet、DataSource、Skill、MCP 和 LensNode 运行时注入之间的关系。</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#E8E4DE"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-sage" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5B8A72"/>
    </marker>
    <marker id="arrow-plum" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8B6F8A"/>
    </marker>
    <marker id="arrow-terra" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#D97757"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
      .node-title { fill: #1A1A1A; font-size: 14px; font-weight: 700; }
      .node-subtitle { fill: #6B6560; font-size: 11px; }
      .node-detail { fill: #8B8680; font-size: 10px; }
      .pill-text { fill: #6B6560; font-size: 9px; font-weight: 600; }
      .edge-label { fill: #6B6560; font-size: 9px; font-weight: 600; }
      .step { fill: #FFFFFF; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#FAF9F6"/>
  <rect x="24" y="24" width="1392" height="1072" rx="18" fill="#FFFFFF" stroke="#E8E4DE"/>
  <rect x="25" y="25" width="1390" height="1070" rx="17" fill="url(#dots)" opacity="0.55"/>

  <circle cx="58" cy="54" r="6" fill="#D97757"/>
  <text x="76" y="61" fill="#1A1A1A" font-size="23" font-weight="700">SourceLens 连接、授权与扩展消费者拓扑</text>
  <text x="76" y="83" fill="#8B8680" font-size="12">DRAFT · DataSource 是首个消费者；Skill 与 MCP 共用同一套 Connection / Credential 基础能力</text>

  <!-- Layer boundaries -->
  <rect x="52" y="108" width="1336" height="184" rx="14" fill="#FDFCFB" stroke="#8B6F8A" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="70" y="130" class="section-title" fill="#8B6F8A">01  PROVIDER &amp; DESCRIPTION PROTOCOL</text>

  <rect x="52" y="314" width="1336" height="300" rx="14" fill="#FDFCFB" stroke="#5B8A72" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="70" y="337" class="section-title" fill="#5B8A72">02  CONNECTION &amp; CREDENTIAL CONTROL PLANE</text>

  <rect x="52" y="638" width="1336" height="205" rx="14" fill="#FDFCFB" stroke="#D97757" stroke-width="1.2" stroke-dasharray="6 4"/>
