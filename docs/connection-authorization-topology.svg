  <text x="508" y="220" class="node-detail" text-anchor="middle">Host / Port / Database</text>
  <text x="508" y="237" class="node-detail" text-anchor="middle">Basic Auth</text>
  <text x="672" y="201" class="node-title" text-anchor="middle">MySQL</text>
  <text x="672" y="220" class="node-detail" text-anchor="middle">Host / Port / Database</text>
  <text x="672" y="237" class="node-detail" text-anchor="middle">Basic Auth</text>
  <text x="836" y="201" class="node-title" text-anchor="middle">Generic Env</text>
