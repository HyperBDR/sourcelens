  <text x="252" y="716" class="node-title" text-anchor="middle">DataSource Connector</text>
  <text x="252" y="737" class="node-subtitle" text-anchor="middle">第一个基础能力消费者</text>
  <text x="252" y="758" class="node-detail" text-anchor="middle">GitHub Repo · Feishu Docs · Database</text>
  <text x="252" y="776" class="node-detail" text-anchor="middle">资源路径 · 目标路径 · 同步策略</text>
  <rect x="143" y="786" width="218" height="16" rx="8" fill="#FCE5DB"/>
  <text x="252" y="797" class="pill-text" text-anchor="middle">DataSource 只保存 connection_id</text>

  <text x="721" y="716" class="node-title" text-anchor="middle">Skill Manifest &amp; Binding</text>
  <text x="721" y="737" class="node-subtitle" text-anchor="middle">skill.manifest.json 声明需求</text>
  <text x="721" y="758" class="node-detail" text-anchor="middle">Parameters · Connections · Capabilities</text>
  <text x="721" y="776" class="node-detail" text-anchor="middle">Binding / User / Run resolution</text>
  <rect x="613" y="786" width="216" height="16" rx="8" fill="#DDEBE3"/>
  <text x="721" y="797" class="pill-text" text-anchor="middle">保存参数与 Connection UUID</text>

  <text x="1188" y="716" class="node-title" text-anchor="middle">MCP Server &amp; Binding</text>
  <text x="1188" y="737" class="node-subtitle" text-anchor="middle">STDIO / URL Transport</text>
  <text x="1188" y="758" class="node-detail" text-anchor="middle">Server Config · Connection Reference</text>
  <text x="1188" y="776" class="node-detail" text-anchor="middle">Secret 不再进入 MCP config</text>
  <rect x="1080" y="786" width="216" height="16" rx="8" fill="#EAE3EC"/>
  <text x="1188" y="797" class="pill-text" text-anchor="middle">只保存非敏感配置与引用</text>

